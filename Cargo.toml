[package]
name = "droidsaw-hermes"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "DROIDSAW Hermes bytecode parser and decompiler for React Native. 21 CLI commands, 239 tests, 1.4M production functions validated. Covers v40–v100."
repository = "https://github.com/droidsaw/droidsaw-hermes"
homepage = "https://droidsaw.com"
keywords = ["hermes", "react-native", "bytecode", "decompiler", "reverse-engineering"]
categories = ["development-tools", "parser-implementations"]

[lib]
name = "droidsaw_hermes"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
droidsaw-common = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
regex = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
sha1 = "0.10"
zip = "2"
oxc_allocator = "0.123"
oxc_ast = "0.123"
oxc_parser = "0.123"
oxc_codegen = "0.123"
oxc_span = "0.123"

[workspace]
