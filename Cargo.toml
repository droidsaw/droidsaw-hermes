[package]
name = "droidsaw-hermes"
version = "2.0.0"
exclude = ["/tests", "/orchestration", "/fuzz"]
edition = "2024"
rust-version.workspace = true
license = "BSD-3-Clause"
description = "DROIDSAW Hermes bytecode parser and decompiler for React Native. Covers HBC v40–v100."
repository = "https://github.com/droidsaw/droidsaw-hermes"
homepage = "https://droidsaw.com"
keywords = ["hermes", "react-native", "bytecode", "decompiler", "reverse-engineering"]
categories = ["development-tools", "parser-implementations"]

[lib]
name = "droidsaw_hermes"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(fuzzing)'] }

[dependencies]
anyhow = { workspace = true }
droidsaw-common = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = "0.9.10"
regex = { workspace = true }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustc-hash = "2.1"
sha1 = { workspace = true }
zip = { workspace = true }
oxc_allocator = "0.127"
oxc_ast = "0.127"
oxc_parser = "0.127"
oxc_codegen = "0.127"
oxc_span = "0.127"

[dev-dependencies]
tempfile = { workspace = true }
droidsaw-fixture-harness = { workspace = true }
proptest = "1"
insta = "1"
